apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-investigator-agent
  labels:
    app.kubernetes.io/name: kube-investigator-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-investigator-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-investigator-agent
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: kube-investigator-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: kube-investigator-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: "https://kube-investigator.services.ai.azure.com/api/projects/jayavardhanazure-8063"
            - name: FOUNDRY_MODEL_DEPLOYMENT
              value: "gpt-5-mini"
            - name: KUBE_INVESTIGATOR_MCP_URL
              value: "http://kube-investigator-mcp.kube-investigator.svc.cluster.local:8000/mcp"
            - name: CHAT_TIMEOUT_SECONDS
              value: "120"
            - name: FOUNDRY_TIMEOUT_SECONDS
              value: "30"
            - name: MCP_TIMEOUT_SECONDS
              value: "15"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
