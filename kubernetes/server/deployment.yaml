apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-investigator-mcp
  labels:
    app.kubernetes.io/name: kube-investigator-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-investigator-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-investigator-mcp
    spec:
      serviceAccountName: kube-investigator-mcp
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: kube-investigator-mcp:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: ASTRONOMY_NAMESPACES
              value: "*"
            - name: GITHUB_REPO_OWNER
              value: "jayagangireddy"
            - name: GITHUB_REPO_NAME
              value: "kube-investigator"
            - name: KUBERNETES_API_TIMEOUT_SECONDS
              value: "4"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
